# ---------------------------------------------------------------- families

[[family]]
id = "CF-BSC-001"
name = "Owner decision notes (verbatim)"
type = "decision-record"
patterns = ["docs/decisions/????-??-??-*.md"]
lifecycle = "active"
change_class = "frozen"
approval = "owner"
maintainer = "owner"
notes = "A new dated owner note is protected from the moment it merges; important ones are also registered individually with a pinned hash."

[[family]]
id = "CF-BSC-002"
name = "Experiment records"
type = "experiment-record"
patterns = ["docs/ml-roadmap/experiments/EXP-*.md"]
lifecycle = "active"
change_class = "living"
approval = "owner"
maintainer = "implementer"
freeze_when = { field = "status", pattern = '^(done|abandoned)\b' }
triggers = []
notes = "Living while planned or running; frozen once its frontmatter status is done or abandoned."

[[family]]
id = "CF-BSC-003"
name = "Dated dataset records (validation snapshots, source-ID reports, L2 plans, owner answers, exposure seed)"
type = "validation-record"
patterns = [
  "docs/ml-roadmap/manifests/*/validation.*.json",
  "docs/ml-roadmap/manifests/*/youtube-source-ids-*",
  "docs/ml-roadmap/manifests/*/l2/**",
  "docs/ml-roadmap/manifests/*/provenance-review/answers-*.json",
  "docs/ml-roadmap/manifests/*/exposure-seed.json",
]
lifecycle = "active"
change_class = "frozen"
approval = "owner"
maintainer = "implementer"

[[family]]
