# Configuration-item registry — BumpSetCut / RallyLab (schema 1)
#
# Lists the documents, records and assets whose changes are controlled.
# Procedure: docs/workflow/CONFIGURATION_MANAGEMENT.md. Check: scripts/ci_check.py.
#
# Revision metadata (last commit, PR, blob id, SHA-256, freshness) is never
# stored here; it is derived from git history. Do not add machine paths,
# credentials or private notes: this repository is public.
#
# Fields
#   id             stable, never reused or renumbered (CI-BSC-NNN items, CF-BSC-NNN families)
#   type           see TYPES in scripts/ci_check.py
#   lifecycle      planned | draft | active | historical | superseded | retired
#   change_class   living (edited as the work changes) | append-only (new entries only;
#                  status transitions are controlled) | frozen (never edited; superseded instead)
#   approval       owner (each change needs the owner's explicit authorisation) | none
#   maintainer     owner | implementer (who keeps it current)
#   sources        what it is derived from: CI/CF ids or repository paths/globs
#   triggers       globs whose change should prompt a review of this item (update triggers)
#   generated_by   the command that regenerates it; hand edits are flagged
#   frozen_sha256  SHA-256 of the file's bytes (not the git blob id), pinned at registration
#   decisions / experiments   D-NNN / EXP-YYYYMMDD-slug references
# Families govern every file matching `patterns` that no item registers.
# A family's `freeze_when` freezes a member once its frontmatter field matches.

schema = 1
project = "BumpSetCut"
item_prefix = "CI-BSC"
family_prefix = "CF-BSC"
controlled_roots = ["docs/", "legal/", "marketing/"]

